<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Au Dé 12</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1e1c0; min-height: 100vh; }
    .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #352419 0%, #4a3529 100%); padding: 20px; }
    .login-card { background: white; border-radius: 12px; padding: 40px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); max-width: 400px; width: 100%; text-align: center; }
    .login-card h1 { color: #352419; margin-bottom: 30px; font-size: 1.8em; }
    .login-card p { color: #666; margin-bottom: 30px; }
    .admin-container { max-width: 1400px; margin: 0 auto; background: #f1e1c0; min-height: 100vh; }
    .admin-header { background: linear-gradient(135deg, #352419 0%, #4a3529 100%); color: white; padding: 30px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logout-btn { background: #d75c1e; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .logout-btn:hover { background: #b3470f; }
    .admin-content { padding: 30px 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; border-radius: 8px; padding: 20px; border-left: 4px solid #d75c1e; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
    .stat-card h3 { color: #666; font-size: 0.9em; margin-bottom: 10px; }
    .stat-card .number { color: #352419; font-size: 2.2em; font-weight: bold; }
    .tabs { display: flex; gap: 20px; border-bottom: 2px solid #ddd; margin-bottom: 30px; }
    .tab-btn { background: none; border: none; padding: 15px 20px; color: #666; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #d75c1e; border-bottom-color: #d75c1e; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .inscriptions-table { width: 100%; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
    .inscriptions-table table { width: 100%; border-collapse: collapse; }
    .inscriptions-table th { background: #352419; color: white; padding: 15px; text-align: left; font-weight: 600; }
    .inscriptions-table td { padding: 15px; border-bottom: 1px solid #eee; }
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
    .status-pending { background: #fff3cd; color: #856404; }
    .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .event-card { background: white; border-radius: 8px; padding: 20px; border-left: 4px solid #d75c1e; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
    .event-info input { width: 100%; padding: 8px 12px; border: 2px solid #ddd; border-radius: 4px; background: white; color: #352419; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loginContainer" class="login-container">
    <div class="login-card">
      <h1>🔐 Espace Admin</h1>
      <p>Connectez-vous avec votre compte Google</p>
      <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID" data-callback="handleCredentialResponse"></div>
      <div id="g_id_signupbutton"></div>
    </div>
  </div>

  <div id="adminPanel" class="admin-container hidden">
    <div class="admin-header">
      <h1>📊 Panneau d'Administration</h1>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
    <div class="admin-content">
      <div class="stats-grid">
        <div class="stat-card"><h3>Total</h3><div class="number">42</div></div>
        <div class="stat-card"><h3>En attente</h3><div class="number">18</div></div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('inscriptions')">📋 Inscriptions</button>
        <button class="tab-btn" onclick="switchTab('events')">📅 Événements</button>
      </div>
      <div id="inscriptions" class="tab-content active">
        <div class="inscriptions-table">
          <table>
            <thead><tr><th>Événement</th><th>Participant</th><th>Email</th><th>Statut</th></tr></thead>
            <tbody><tr><td>Soirée BOTC</td><td>Jean Dupont</td><td>jean@example.com</td><td><span class="status-badge status-pending">En attente</span></td></tr></tbody>
          </table>
        </div>
      </div>
      <div id="events" class="tab-content">
        <div class="events-grid">
          <div class="event-card">
            <h3>🎯 Soirée BOTC</h3>
            <div class="event-info"><label>Capacité</label><input type="number" value="30"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleCredentialResponse(response) {
      document.getElementById('loginContainer').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
    }
    function logout() {
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('loginContainer').classList.remove('hidden');
    }
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }
    window.addEventListener('load', function() {
      google.accounts.id.initialize({
        client_id: 'YOUR_GOOGLE_CLIENT_ID',
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(document.getElementById('g_id_signupbutton'), { theme: 'outline', size: 'large' });
    });
  </script>
</body>
</html>
